{% extends "base.html" %}

{% block titulo %}Regístrate{% endblock %}

{% block contenido %}
<h1>Crea tu cuenta</h1>

{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<form method="POST" action="/signup">
    <input type="hidden" name="_csrf" value="{{ csrf }}" />
    <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control" type="text" id="username" name="username" value="{{ username }}"
            minlength="3" required autofocus />
    </div>
    <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" type="password" id="password" name="password" minlength="6" required />
    </div>
    <div class="mb-3">
        <label class="form-label" for="confirmacion">Repite la contraseña</label>
        <input class="form-control" type="password" id="confirmacion" name="confirmacion" minlength="6" required />
    </div>
    <button class="btn btn-primary" type="submit">Crear cuenta</button>
    <a class="btn btn-outline-secondary" href="/login">Ya tengo cuenta</a>
</form>
{% endblock %}

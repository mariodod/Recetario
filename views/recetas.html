<!-- https://mozilla.github.io/nunjucks/ -->
{% extends "base.html" %}

{% block titulo %}Recetas{% endblock %}

{% block contenido %}
<ul class="list-group">
    {% for receta in recetas %}
    <li class="list-group-item">
        {{ receta.titulo }}
        {% if receta.tiempo %}
        <span class="badge bg-secondary">{{ receta.tiempo }} min</span>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}

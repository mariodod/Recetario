<!-- https://mozilla.github.io/nunjucks/ -->
{% extends "base.html" %}

{% block titulo %}{{ receta.titulo }}{% endblock %}

{% block contenido %}
<h1>{{ receta.titulo }}</h1>
{% if receta.tiempo %}
<p>
    {{ receta.tiempo }} minutos
    {% if receta.tiempo > 60 %} (preparación larga) {% endif %}
</p>
{% endif %}
{% endblock %}

{% extends "base.html" %}

{% block titulo %}Agregar receta{% endblock %}

{% block contenido %}
<h1>Agregar receta</h1>

{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<form method="POST" action="/receta">
    <div class="mb-3">
        <label class="form-label" for="titulo">Título</label>
        <input class="form-control" type="text" id="titulo" name="titulo" value="{{ receta.titulo }}"
            required autofocus />
    </div>
    <div class="mb-3">
        <label class="form-label" for="tiempo">Tiempo de preparación (minutos)</label>
        <input class="form-control" type="number" id="tiempo" name="tiempo" min="1"
            value="{{ receta.tiempo }}" />
    </div>
    <button class="btn btn-primary" type="submit">Guardar receta</button>
</form>
{% endblock %}
